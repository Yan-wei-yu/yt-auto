<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="Huninn, Noto Sans TC, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CAF50"/><stop offset="1" stop-color="#1F7A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
