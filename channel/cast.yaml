# 卡通角色庫：每週新聞裡的人物，和擬人化的公司、數據。
# 腳本裡用 cast: [{who: warsh, mood: zipped, arms: down, say: ..., quote: true}] 叫他們上台。
#
# 人物（kind: person）
#   real: true 代表真實人物 → 對話框只能放他真的說過的話（並在段落加 quote: true），玩笑留給旁白
#   hair.style：short / side_part / swept / spiky / bald / long
#   outfit.type：suit（西裝，可設 tie 顏色）/ leather（皮衣）/ tshirt
# 物件（kind: object）
#   shape：server（伺服器）/ gas_pump（加油機）/ barrel（油桶）/ bank（銀行）/ podium（講台，給團體角色）/ screen（報價螢幕，給指數）
#
# 原則：辨識靠名牌和招牌穿著，不誇大長相；不畫寫實臉孔、不用照片。

