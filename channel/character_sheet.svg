<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, WenQuanYi Zen Hei, sans-serif">
  <defs>
    <radialGradient id="bodyG" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5A5052"/>
      <stop offset="0.6" stop-color="#3B3536"/>
      <stop offset="1" stop-color="#2A2425"/>
    </radialGradient>
    <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="0.55" stop-color="#FFC15E"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1F5BD6"/>
      <stop offset="0.6" stop-color="#5FA8FF"/>
      <stop offset="1" stop-color="#CFE6FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="bodyClip">
      <path d="M400,345 C520,340 610,430 605,560 C600,690 520,780 400,782 C280,784 195,700 195,565 C195,430 280,350 400,345 Z"/>
    </clipPath>
    <!-- 三瓣火焰，原點在火焰底部中央 -->
    <g id="flame">
      <path d="M-42,10 C-56,-30 -34,-52 -30,-88 C-18,-62 -10,-58 -6,-112 C6,-70 20,-62 30,-96 C44,-58 56,-24 40,10 Z" fill="url(#flameG)"/>
      <path d="M-20,8 C-26,-14 -12,-26 -10,-46 C-2,-30 6,-30 10,-50 C18,-28 26,-12 18,8 Z" fill="#FFF3C4"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#F4EFE6"/>
  <rect x="820" y="40" width="740" height="920" rx="28" fill="#FFFFFF" opacity="0.65"/>

  <!-- ===== 正面立繪 ===== -->
  <ellipse cx="400" cy="852" rx="175" ry="22" fill="#000" opacity="0.12"/>

  <!-- 腳＋藍白拖 -->
  <rect x="346" y="752" width="34" height="70" rx="16" fill="#342E2F"/>
  <rect x="420" y="752" width="34" height="70" rx="16" fill="#342E2F"/>
  <ellipse cx="360" cy="830" rx="44" ry="13" fill="#F2F2F2" stroke="#CFCFCF" stroke-width="2"/>
  <ellipse cx="440" cy="830" rx="44" ry="13" fill="#F2F2F2" stroke="#CFCFCF" stroke-width="2"/>
  <rect x="334" y="805" width="54" height="16" rx="8" fill="#2F6FD6"/>
  <rect x="412" y="805" width="54" height="16" rx="8" fill="#2F6FD6"/>

  <!-- 鍋鏟（在右手後面） -->
  <line x1="598" y1="600" x2="676" y2="430" stroke="#8B5A2B" stroke-width="13" stroke-linecap="round"/>
  <path d="M652,440 L700,452 L716,380 L676,366 Z" fill="#C9CDD2" stroke="#9AA0A6" stroke-width="3" stroke-linejoin="round"/>

  <!-- 手 -->
  <ellipse cx="214" cy="600" rx="30" ry="46" transform="rotate(28 214 600)" fill="#3B3536"/>
  <ellipse cx="590" cy="598" rx="30" ry="46" transform="rotate(-30 590 598)" fill="#3B3536"/>

  <!-- 身體 -->
  <path d="M400,345 C520,340 610,430 605,560 C600,690 520,780 400,782 C280,784 195,700 195,565 C195,430 280,350 400,345 Z" fill="url(#bodyG)"/>
  <g fill="#231E1F" opacity="0.55">
    <circle cx="300" cy="640" r="4"/><circle cx="520" cy="470" r="3"/><circle cx="250" cy="520" r="3"/>
    <circle cx="455" cy="380" r="3"/><circle cx="560" cy="560" r="4"/><circle cx="330" cy="720" r="3"/>
  </g>

  <!-- 發光裂紋：頭頂左側、身體右下 -->
  <g stroke="#FF7A1A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="292,392 312,414 300,432 326,456"/>
    <polyline points="312,414 334,404"/>
    <polyline points="566,628 548,652 568,676 552,704"/>
  </g>

  <!-- 圍裙＋菊炭紋章 -->
  <g clip-path="url(#bodyClip)">
    <path d="M262,622 Q400,600 538,622 L566,800 L234,800 Z" fill="#D93A2B"/>
    <path d="M262,622 Q400,600 538,622" stroke="#B22E21" stroke-width="5" fill="none"/>
  </g>
  <g stroke="#F7F3EA" stroke-linecap="round" fill="none">
    <circle cx="400" cy="694" r="36" stroke-width="5"/>
    <g stroke-width="4">
      <line x1="400" y1="680" x2="400" y2="664"/><line x1="400" y1="708" x2="400" y2="724"/>
      <line x1="386" y1="694" x2="370" y2="694"/><line x1="414" y1="694" x2="430" y2="694"/>
      <line x1="390" y1="684" x2="379" y2="673"/><line x1="410" y1="704" x2="421" y2="715"/>
      <line x1="410" y1="684" x2="421" y2="673"/><line x1="390" y1="704" x2="379" y2="715"/>
    </g>
    <circle cx="400" cy="694" r="5" fill="#F7F3EA" stroke="none"/>
  </g>

  <!-- 臉 -->
  <ellipse cx="272" cy="584" rx="30" ry="17" fill="#FF8A4C" filter="url(#soft)"/>
  <ellipse cx="528" cy="584" rx="30" ry="17" fill="#FF8A4C" filter="url(#soft)"/>
  <ellipse cx="330" cy="518" rx="46" ry="56" fill="#FFFFFF"/>
  <ellipse cx="470" cy="518" rx="46" ry="56" fill="#FFFFFF"/>
  <ellipse cx="337" cy="528" rx="27" ry="33" fill="#2A1E1A"/>
  <ellipse cx="463" cy="528" rx="27" ry="33" fill="#2A1E1A"/>
  <circle cx="347" cy="513" r="10" fill="#FFFFFF"/><circle cx="327" cy="542" r="5" fill="#FFFFFF"/>
  <circle cx="473" cy="513" r="10" fill="#FFFFFF"/><circle cx="453" cy="542" r="5" fill="#FFFFFF"/>
  <path d="M376,590 Q400,614 424,590" stroke="#1F1819" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 白毛巾頭帶，左側打結 -->
  <path d="M212,462 Q400,362 588,462 L592,494 Q400,400 208,494 Z" fill="#F7F3EA" stroke="#D8D0C0" stroke-width="2"/>
  <g stroke="#E4DCCD" stroke-width="2">
    <line x1="300" y1="420" x2="298" y2="452"/><line x1="350" y1="405" x2="349" y2="438"/>
    <line x1="450" y1="405" x2="451" y2="438"/><line x1="500" y1="420" x2="502" y2="452"/>
  </g>
  <path d="M214,470 C190,480 170,505 160,535 C178,520 192,512 206,505 Z" fill="#F7F3EA" stroke="#D8D0C0" stroke-width="2"/>
  <path d="M214,476 C200,500 196,530 200,556 C210,532 220,515 228,502 Z" fill="#F7F3EA" stroke="#D8D0C0" stroke-width="2"/>
  <ellipse cx="216" cy="478" rx="20" ry="16" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="2"/>

  <!-- 頭頂火苗 -->
  <use href="#flame" transform="translate(400 358)" filter="url(#glow)"/>

  <text x="400" y="930" text-anchor="middle" font-size="26" fill="#6B5F57">正面｜身高約 20 cm（比碗大一點）</text>

  <!-- ===== 右側說明 ===== -->
  <text x="860" y="120" font-size="64" font-weight="700" fill="#2A1E1A">阿炭 A-Tan</text>
  <text x="862" y="166" font-size="26" fill="#6B5F57">LittleFire 小火｜原創角色設定 v1</text>
  <text x="862" y="206" font-size="22" fill="#6B5F57">脾氣火爆的小炭精，夢想成為夜市第一名廚，卻學不會「小火」。</text>

  <text x="862" y="262" font-size="28" font-weight="700" fill="#2A1E1A">配色</text>
  <g font-size="15" fill="#4A403A" text-anchor="middle">
    <rect x="862" y="282" width="60" height="60" rx="12" fill="#3B3536"/><text x="892" y="362">#3B3536</text>
    <rect x="1002" y="282" width="60" height="60" rx="12" fill="#5A5052"/><text x="1032" y="362">#5A5052</text>
    <rect x="1142" y="282" width="60" height="60" rx="12" fill="#FF7A1A"/><text x="1172" y="362">#FF7A1A</text>
    <rect x="1282" y="282" width="60" height="60" rx="12" fill="#FFC15E"/><text x="1312" y="362">#FFC15E</text>
    <rect x="1422" y="282" width="60" height="60" rx="12" fill="#FFE08A"/><text x="1452" y="362">#FFE08A</text>
    <rect x="862" y="380" width="60" height="60" rx="12" fill="#FF8A4C"/><text x="892" y="460">#FF8A4C</text>
    <rect x="1002" y="380" width="60" height="60" rx="12" fill="#F7F3EA" stroke="#D8D0C0"/><text x="1032" y="460">#F7F3EA</text>
    <rect x="1142" y="380" width="60" height="60" rx="12" fill="#D93A2B"/><text x="1172" y="460">#D93A2B</text>
    <rect x="1282" y="380" width="60" height="60" rx="12" fill="#2F6FD6"/><text x="1312" y="460">#2F6FD6</text>
    <rect x="1422" y="380" width="60" height="60" rx="12" fill="#F2F2F2" stroke="#CFCFCF"/><text x="1452" y="460">#F2F2F2</text>
  </g>

  <text x="862" y="520" font-size="28" font-weight="700" fill="#2A1E1A">火焰＝情緒（每集的劇情引擎）</text>
  <g font-size="20" fill="#4A403A" text-anchor="middle">
    <use href="#flame" transform="translate(912 650) scale(0.5)"/>
    <text x="912" y="690">平靜</text>
    <use href="#flame" transform="translate(1042 650) scale(0.75 1.15)"/>
    <text x="1042" y="690">激動 → 燒焦</text>
    <circle cx="1172" cy="640" r="9" fill="#FF7A1A" filter="url(#glow)"/>
    <path d="M1172,628 C1162,614 1182,604 1170,590 C1162,580 1178,572 1172,560" stroke="#9A9A9A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="1172" y="690">害怕 → 熄火</text>
    <path d="M1302,650 C1262,622 1262,586 1286,580 C1296,578 1302,586 1302,594 C1302,586 1308,578 1318,580 C1342,586 1342,622 1302,650 Z" fill="url(#flameG)" filter="url(#glow)"/>
    <text x="1302" y="690">愛</text>
    <use href="#flame" transform="translate(1432 650) scale(0.55)" style="filter:hue-rotate(190deg)"/>
    <text x="1432" y="690">太辣 → 藍火</text>
  </g>

  <text x="862" y="752" font-size="28" font-weight="700" fill="#2A1E1A">識別特徵</text>
  <g font-size="22" fill="#4A403A">
    <text x="872" y="792">• 白毛巾綁頭，左側打結（夜市阿伯風）</text>
    <text x="872" y="826">• 紅圍裙＋白色「菊炭」紋章（＝頻道 logo）</text>
    <text x="872" y="860">• 藍白拖、頭頂左側和身體右下的發光裂紋</text>
    <text x="872" y="894">• 不講人話：只有劈啪聲、「噗」和哼歌</text>
  </g>
  <text x="872" y="934" font-size="19" fill="#A0453A">✗ 不要尾巴、不像蜥蜴或龍　✗ 不要毛茸茸　✗ 不要方塊或獨眼</text>
</svg>
