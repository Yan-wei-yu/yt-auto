# 阿韭的角色設定（給人看，也給 AI 圖片/影片工具用）

name: 阿韭
name_en: A-Jiu
species: 一根韭菜（散戶的自嘲：被割了又長回來）
one_liner: 每週都被割、每週都長回來的美股散戶。口頭禪：「這次不一樣！」
personality:
  - 追高殺低、超容易 FOMO，但每次都真心相信「這次不一樣」
  - 被割了會哭，哭完葉子又長回來（韌性是他唯一的優點）
  - 手機不離手，半夜也在看盤
  - 他是散戶，不是老師：只吐槽、不報明牌

# 葉子就是心情；channel/poses/ 裡有對應的圖，段落用 pose 指定
moods:
  flat: 葉子自然散開，平常的看戲表情
  up: 葉子全部往上衝，瞇眼大笑，手機舉高（大漲）
  down: 葉子枯萎下垂、冒冷汗（下跌）
  cut: 葉子被剪平還貼 OK 繃、噴淚（崩盤、被割）
  shock: 葉子炸開、眼睛縮小（爆量、意外消息）

signature:
  - 圓框眼鏡
  - 紅領帶（台灣紅＝漲，他永遠在等紅）
  - 手機螢幕上永遠是 K 線
  - 根鬚當腳

palette:
  leaf: "#4CAF50"
  leaf_dark: "#2E8B3E"
  stalk: "#EAF5D3"
  tie: "#E53935"
  up: "#FF4D4F"
  down: "#22C55E"
  navy: "#0F1420"
  gold: "#FFD54A"

# 想做 3D 版縮圖或片頭動畫時，用這段 prompt＋character_sheet.png 當參考
prompt: >-
  A-Jiu, an original cute cartoon character: a single leek about 25 cm tall, white-to-light-green
  stalk body with soft vertical fibers, three long dark-green leaves on top like hair, round
  black-rimmed glasses, rosy cheeks, a small red necktie, thin green stem arms holding a
  smartphone showing a stock chart, little beige roots as feet. Clean stylized 3D look, soft
  studio lighting, no text
