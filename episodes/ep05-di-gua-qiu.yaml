id: ep05
slug: di-gua-qiu
dish: 地瓜球
title: 地瓜球飛走了
title_en: The Sweet Potato Balls Flew Away
setting: night_market
publish_at: 2026-11-03 18:00
logline: 炸地瓜球要邊炸邊壓才會膨成空心，阿炭想做出全夜市最大顆的。（結局：飄上夜空，開放式收尾）
music:
  mood: 輕飄飄的手風琴，結尾轉溫柔
  file:

shots:
  - id: s01
    beat: hook
    duration: 4
    action: 一串像氣球一樣大的金黃地瓜球從油鍋飄起來，阿炭拿著網杓跳起來想撈。
    camera: medium shot, looking slightly up
    prompt: >-
      A cluster of golden fried sweet potato balls, puffed up as big as balloons, floats up out of
      the fryer into the night air. A-Tan jumps as high as he can, swinging a mesh strainer to
      catch them
    sfx: 輕飄飄的音效、阿炭驚叫
    caption: 地瓜球…飛走了？！
    caption_en: The sweet potato balls... are flying away?!

  - id: s02
    beat: setup
    duration: 5
    action: （稍早）他用網杓把油鍋裡的小地瓜球壓下去，每壓一次就膨大一點，他眼睛發亮。
    camera: close-up on the fryer
    prompt: >-
      Earlier: A-Tan presses small sweet potato balls down into the hot oil with a mesh strainer.
      Each time he presses, the balls puff up a little bigger and rounder. His eyes light up with
      excitement
    sfx: 噗、噗、油炸聲
    caption: 邊炸邊壓，它就會膨起來
    caption_en: Press while frying and they puff up

  - id: s03
    beat: trouble
    duration: 5
    action: 他越壓越快，火苗越燒越旺，地瓜球膨到跟西瓜一樣大。
    camera: medium shot of the fryer and A-Tan
    prompt: >-
      A-Tan presses faster and faster, his head flame burning brighter and taller. The sweet potato
      balls swell up to the size of watermelons, glowing golden, bobbing on the oil
    sfx: 越來越快的「噗噗噗」
    caption: 再大一點！要全夜市最大顆！
    caption_en: Bigger! The biggest in the whole night market!

  - id: s04
    beat: twist
    duration: 5
    action: 他用長竹籤把飄起來的大球串成一串，結果被整串拉上天，藍白拖在空中晃。
    camera: medium-wide shot, camera tilting up as he rises
    prompt: >-
      A-Tan skewers the floating giant balls on a long bamboo stick like a bunch of balloons, but
      they lift him right off the ground. His tiny blue-and-white slippers dangle in the air as he
      floats upward, startled
    sfx: 「咻——」上升的音效
    caption: 抓到了！…欸？
    caption_en: Got them! ...Huh?

  - id: s05
    beat: ending
    duration: 6
    action: 他飄在夜市上空，往下看燈火，聳聳肩咬一口地瓜球，乾脆放鬆享受夜景。
    camera: wide shot from above, night-market lights below
    prompt: >-
      A-Tan floats high above the glowing night market holding his bunch of giant sweet potato
      balls. He looks down at the lights, shrugs, takes a crispy bite from one ball, and relaxes,
      enjoying the view with a calm small flame
    sfx: 遠處夜市人聲、酥脆的咬下聲、溫柔的音樂
    caption: 算了，夜景也不錯
    caption_en: Oh well. Nice view, though.

