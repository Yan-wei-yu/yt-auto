id: ep04
slug: cong-zhua-bing
dish: 蔥抓餅
title: 抓太大力了
title_en: Scrunched Too Hard
setting: night_market
publish_at: 2026-10-31 18:00
logline: 蔥抓餅好吃的秘訣是「抓」，阿炭理解得太字面了。（順敘，慢動作爆點）
music:
  mood: 西部對決風的口哨開場，接節奏感強的吉他
  file:

shots:
  - id: s01
    beat: hook
    duration: 4
    action: 西部對決風：阿炭雙手各拿一把鍋鏟，瞇眼瞪著鐵板上膨起來的蔥餅，一陣風吹過。
    camera: low dramatic angle across the griddle, standoff framing
    prompt: >-
      Western standoff style: A-Tan stands on the counter behind a flat iron griddle, a spatula in
      each tiny hand, eyes narrowed, staring down a puffed-up scallion pancake. A gust of wind
      blows a few flour specks and green onion bits across the frame
    sfx: 口哨、風聲、煎烤聲
    caption: 蔥抓餅，最重要的就是「抓」
    caption_en: "The key to scallion pancake: the scrunch"

  - id: s02
    beat: setup
    duration: 5
    action: 他用兩把鍋鏟從兩邊往中間抓，餅開始一層層散開，他越抓越興奮，火苗越來越高。
    camera: close-up on the pancake and spatulas
    prompt: >-
      A-Tan pushes the pancake from both sides toward the middle with the two spatulas, and its
      layers start to open up into flaky ribbons. He gets more and more excited, his head flame
      flaring higher with every push
    sfx: 夾、夾、夾，酥皮散開的聲音
    caption: 從兩邊往中間抓，讓它層層散開
    caption_en: Push from both sides so the layers open up

  - id: s03
    beat: trouble
    duration: 5
    action: 慢動作：他使出全力一夾，蔥餅「砰」一聲炸開成上百片金黃酥皮，飛滿整個畫面。
    camera: close-up, slow motion
    prompt: >-
      Slow motion: A-Tan gives one huge squeeze and the scallion pancake bursts apart into
      hundreds of flaky golden layers that fly up and fill the whole frame like confetti, green
      onion bits sparkling in the warm light
    sfx: 「砰！」、慢動作的低沉音效、酥脆碎裂聲
    caption: 太…用…力…了…
    caption_en: Way... too... hard...

  - id: s04
    beat: twist
    duration: 5
    action: 酥皮像雪一樣慢慢飄落，剛好全部落進他舉著的紙袋裡，堆成一座小山。
    camera: medium shot, A-Tan holding up a paper bag
    prompt: >-
      The golden flakes drift down slowly like snow and, one after another, all land neatly inside
      a paper bag that A-Tan holds up, piling into a perfect fluffy mountain
    sfx: 輕柔的飄落聲、「叮」
    caption: 這樣…也算抓開了吧
    caption_en: Well... that counts as "opened up"

  - id: s05
    beat: ending
    duration: 6
    action: 他在上面放一顆半熟荷包蛋、刷醬油膏，咬一口，蛋汁流出來，滿足地閉眼。
    camera: close-up on the food and A-Tan's face
    prompt: >-
      A-Tan places a sunny-side-up egg with a runny yolk on top of the flaky pile, brushes on sweet
      soy paste, and takes a bite. The yolk oozes out and he closes his eyes in bliss, head flame
      swaying gently
    sfx: 咬下去的酥脆聲、滿足的哼聲
    caption: 加蛋，半熟
    caption_en: Add egg. Runny, of course.

youtube:
  title: 蔥抓餅的「抓」不是這樣用的啦 😂｜阿炭
  title_en: That's NOT how you scrunch a scallion pancake 😂
  description: |
    蔥抓餅好吃的秘訣，是起鍋前從兩邊往中間抓，讓餅一層一層散開。
    阿炭理解得太字面了。

    你的蔥抓餅都加什麼？加蛋？加起司？
  description_en: |
    The secret to a flaky Taiwanese scallion pancake: scrunch it from both sides so the layers open up.
    A-Tan took it a little too literally.

    What do you add to yours? Egg? Cheese?
