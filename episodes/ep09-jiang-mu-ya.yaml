id: ep09
slug: jiang-mu-ya
dish: 薑母鴨
title: 老薑太辣，火變藍色了
title_en: The Ginger Turned His Fire Blue
setting: winter_stall
publish_at: 2026-11-12 18:00
logline: 冬天第一鍋薑母鴨，阿炭偷吃一片老薑，火焰變成藍色。（順敘，季節集）
music:
  mood: 冬夜的溫暖爵士鋼琴
  file:

shots:
  - id: s01
    beat: hook
    duration: 4
    action: 大特寫：老薑片丟進黑麻油裡滋滋爆香冒煙，鍋下的阿炭當炭火、冷得搓手。
    camera: extreme close-up on the clay pot, A-Tan glowing below
    prompt: >-
      Extreme close-up: thick slices of old ginger drop into dark sesame oil in a clay pot and
      sizzle loudly, curling at the edges, fragrant smoke rising. Below the pot, A-Tan glows as its
      charcoal fire, rubbing his little hands together in the cold
    sfx: 麻油爆香滋滋聲、冷風
    caption: 冬天第一鍋：薑母鴨
    caption_en: "First hot pot of winter: ginger duck"

  - id: s02
    beat: setup
    duration: 4
    action: 鴨肉和湯咕嘟咕嘟，阿炭左右張望，偷偷伸筷子夾走一片老薑。
    camera: medium shot of the low table and pot
    prompt: >-
      Duck pieces simmer in dark broth in the clay pot. A-Tan glances left and right, then sneakily
      reaches up with chopsticks and steals a thick slice of old ginger from the pot
    sfx: 咕嘟咕嘟、躡手躡腳的音效
    caption: 偷吃一片就好…
    caption_en: Just one little bite...

  - id: s03
    beat: trouble
    duration: 5
    action: 他一咬，臉瞬間皺成一團、臉頰漲紅、眼淚飆出來，全身發抖。
    camera: close-up on A-Tan's face
    prompt: >-
      A-Tan chews the slice of old ginger. Instantly his face scrunches up, his cheeks glow bright
      red, cartoon tears spray from his eyes, and his whole body shakes
    sfx: 嚼、「嘶——」、發抖的音效
    caption: 老薑…好辣！！
    caption_en: Old ginger... SO SPICY!!

  - id: s04
    beat: twist
    duration: 4
    action: 他頭上的火從橘色變成亮藍色，他在鍋蓋的反光裡看到自己，嚇一跳。
    camera: close-up on A-Tan and his reflection in the shiny pot lid
    prompt: >-
      A-Tan's head flame suddenly changes from orange to a bright electric blue. He catches his
      reflection in the shiny lid of the clay pot and jumps back in surprise, staring at his new
      blue flame
    sfx: 「咻」變色音效、驚訝的叫聲
    caption: 我的火…變藍色了？
    caption_en: My fire... turned BLUE?

  - id: s05
    beat: twist
    duration: 5
    action: 他倒一點米酒進鍋，湯面燃起一整片漂亮的藍色火焰，照亮冬夜的攤位，他看呆了。
    camera: medium shot, the pot lighting up the dark stall
    prompt: >-
      A-Tan pours a splash of rice wine into the pot and the surface of the soup bursts into a
      beautiful dancing sheet of blue flame, lighting up the dark winter stall. He stares at it in
      awe, his own flame blue to match
    sfx: 「呼——」點燃聲、讚嘆
    caption: 米酒下去，整鍋都藍了
    caption_en: Add rice wine... the whole pot goes blue

  - id: s06
    beat: ending
    duration: 5
    action: 他捧著一碗冒煙的湯慢慢喝一口，藍色火焰慢慢變回溫暖的橘色，舒服地吐出一口白霧。
    camera: medium close-up, cozy warm light
    prompt: >-
      A-Tan holds a steaming bowl of ginger duck soup with both hands and takes a slow sip. His
      blue flame gradually fades back to a warm cozy orange, and he lets out a long satisfied sigh
      that turns into a cloud of white breath
    sfx: 喝湯聲、長長的「哈——」
    caption: 暖到心裡
    caption_en: Warm all the way through

