    蚵仔煎最考驗功力的就是翻面那一下。
    阿炭一緊張，力氣就跟火一起暴衝了。

    你吃蚵仔煎是醬多還是醬少？
  description_en: |
    The flip is the hardest part of making a Taiwanese oyster omelette.
    When A-Tan gets nervous, his strength flares up along with his fire.

    Extra sauce or light sauce?
