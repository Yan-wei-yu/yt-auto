id: ep07
slug: o-a-jian
dish: 蚵仔煎
title: 翻到天花板
title_en: Flipped to the Ceiling
setting: night_market
publish_at: 2026-11-07 18:00
logline: 蚵仔煎最難的是翻面，阿炭一緊張翻太大力，蚵仔煎黏上天花板。（結局：驚險接住）
music:
  mood: 緊張的小鼓滾奏，接住時變成歡呼
  file:

shots:
  - id: s01
    beat: hook
    duration: 4
    action: 一張蚵仔煎啪一聲黏在攤位的鐵皮天花板上，阿炭拿著鍋鏟抬頭，嘴巴張開。
    camera: low angle looking up from the griddle
    prompt: >-
      A whole oyster omelette is stuck flat on the metal ceiling of the night-market stall with a
      splat. Below, A-Tan stares straight up holding his spatula, mouth hanging open
    sfx: 「啪！」黏住的聲音
    caption: 翻面…翻過頭了
    caption_en: The flip... went a bit too far

  - id: s02
    beat: setup
    duration: 5
    action: （稍早）鐵板上的蚵仔、蛋、青菜和地瓜粉漿滋滋作響，阿炭盯著準備翻面。
    camera: close-up on the griddle
    prompt: >-
      Earlier: on a hot iron griddle, plump oysters, egg, leafy greens and translucent starch
      batter sizzle together into an omelette. A-Tan stares at it intensely, spatula raised, ready
      to flip
    sfx: 滋滋煎烤聲、緊張的鼓聲
    caption: 蚵仔煎，成敗就在翻面這一下
    caption_en: An oyster omelette lives or dies by the flip

  - id: s03
    beat: trouble
    duration: 4
    action: 他太緊張火苗暴衝，用力一翻，蚵仔煎旋轉著飛上去。
    camera: medium shot, slow motion as it rises
    prompt: >-
      Nervous, A-Tan's flame spikes and he flips with far too much force. The oyster omelette
      spins high into the air in slow motion, heading for the ceiling
    sfx: 「咻——」
    caption: 太用力了啦！
    caption_en: Way too hard!

  - id: s04
    beat: twist
    duration: 6
    action: 他在下面拿著盤子左右移動，蚵仔煎慢慢剝落掉下來，他閉眼——正好落在盤子正中央。
    camera: medium shot, A-Tan below, ceiling in frame
    prompt: >-
      A-Tan shuffles left and right below, holding up a plate, eyes nervously fixed on the ceiling.
      The omelette slowly peels off and falls. He squeezes his eyes shut, and it lands perfectly
      centered on the plate with a soft plop
    sfx: 慢慢剝落的聲音、「噗」落在盤子上
    caption: 接…接住了！
    caption_en: C-caught it!

  - id: s05
    beat: ending
    duration: 5
    action: 他淋上甜辣醬畫出一顆愛心，得意地把盤子舉向鏡頭。
    camera: medium close-up facing camera
    prompt: >-
      A-Tan drizzles pink-red sweet chili sauce over the oyster omelette in the shape of a heart,
      then proudly holds the plate up toward the camera with a big grin
    sfx: 擠醬聲、「鏘鏘！」
    caption: 天花板烘烤版，限定一份
    caption_en: Ceiling-roasted edition. Only one available.

