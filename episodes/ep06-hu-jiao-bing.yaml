slug: hu-jiao-bing
dish: 胡椒餅
title: 爐子不夠熱，那我自己進去
title_en: Oven Not Hot Enough? He Climbs In
setting: night_market
publish_at: 2026-11-05 18:00
logline: 胡椒餅要貼在陶甕爐內壁用炭火烤，炭火不夠旺，阿炭決定自己跳進去當炭。（順敘，ASMR 開場）
music:
  mood: 有節奏的手鼓，跳進爐子時轉成搖滾
  file:

shots:
  - id: s01
    beat: hook
    duration: 4
    action: 特寫：阿炭的小手把生胡椒餅一顆一顆「啪、啪、啪」貼上陶甕爐內壁，節奏很療癒。
    camera: close-up inside the clay barrel oven
    prompt: >-
      Close-up inside a big clay barrel oven: A-Tan's tiny hands slap raw pepper buns sprinkled
      with white sesame onto the curved inner wall, one after another in a quick satisfying rhythm
    sfx: 啪、啪、啪（節奏感）
    caption: 胡椒餅，要貼在爐壁上烤
    caption_en: Pepper buns bake stuck to the oven wall

  - id: s02
    beat: setup
    duration: 4
    action: 他往爐底一看，只有幾顆暗暗的炭，皺眉，然後低頭看看自己發光的身體，想到一個主意。
    camera: top-down view into the oven, then A-Tan's face
    prompt: >-
      A-Tan peers down into the bottom of the clay oven and sees only a few dim, weak coals. He
      frowns, then slowly looks down at his own glowing body as an idea lights up his face
    sfx: 微弱的劈啪聲、「嗯？」、「叮！」
    caption: 炭火…不夠旺
    caption_en: The coals... aren't hot enough

  - id: s03
    beat: trouble
    duration: 4
    action: 他爬上爐口邊緣，深呼吸，抱膝砲彈跳水跳進去，爐口噴出一陣火星。
    camera: medium shot of the oven opening
    prompt: >-
      A-Tan climbs onto the rim of the clay barrel oven, takes a big deep breath, hugs his knees and
      cannonballs straight down inside. A burst of sparks shoots up out of the oven opening
    sfx: 深呼吸、「咚」、火星噴出
    caption: 沒關係，我就是炭
    caption_en: No problem. I AM charcoal.

  - id: s04
    beat: trouble
    duration: 5
    action: 爐內視角：阿炭坐在爐底握拳蓄力，火焰往上衝，整個爐子變成橘紅色，四周的胡椒餅膨起變金黃。
    camera: inside the oven looking up, A-Tan at the bottom
    prompt: >-
      View from inside the oven: A-Tan sits at the bottom, clenches his fists and powers up. His
      flame roars upward and fills the whole oven with bright orange heat, and the pepper buns on
      the walls around him puff up and turn golden
    sfx: 蓄力的聲音、火焰轟轟聲
    caption: 火力全開！
    caption_en: Full power!

  - id: s05
    beat: twist
    duration: 4
    action: 他爬出來，全身沾滿白芝麻，像一顆芝麻球，咳出一小團煙、眨眨眼。
    camera: medium close-up at the oven rim
    prompt: >-
      A-Tan climbs back out over the rim, his whole body completely coated in white sesame seeds
      like a sesame ball. He coughs out a little puff of smoke and blinks
    sfx: 咳咳、芝麻掉落的沙沙聲
    caption: （芝麻口味的炭）
    caption_en: (Sesame-flavored charcoal)

  - id: s06
    beat: ending
    duration: 5
    action: 他夾出一個酥脆的胡椒餅咬開，熱湯汁和蒸氣噴出來，他燙得跳腳但笑得很開心。
    camera: close-up on the bun and A-Tan's face
    prompt: >-
      A-Tan pulls a crispy golden pepper bun off the oven wall with long tongs and bites into it.
      Hot juicy steam bursts out of the filling. He hops from foot to foot because it is so hot,
      but grins happily
    sfx: 酥脆聲、蒸氣噴出聲、「燙燙燙」
    caption: 連木炭都覺得燙
    caption_en: Too hot even for charcoal

