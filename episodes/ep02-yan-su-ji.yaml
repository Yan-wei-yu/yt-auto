id: ep02
slug: yan-su-ji
dish: 鹽酥雞
title: 九層塔一下鍋就爆炸
title_en: The Basil Exploded
setting: night_market
publish_at: 2026-10-27 18:00
logline: 阿炭在夜市炸鹽酥雞，一切都很完美，直到九層塔下鍋。（倒敘結構）
music:
  mood: 夜市的熱鬧感，輕快的打擊樂
  file:

shots:
  - id: s01
    beat: hook
    duration: 4
    action: 九層塔丟進油鍋瞬間爆油，阿炭嚇得原地跳起來，頭上火焰暴衝。
    camera: close-up on a wok of hot oil, A-Tan beside it
    prompt: >-
      A handful of fresh basil leaves drops into a wok of hot oil and the oil violently spits and
      crackles. A-Tan, standing beside the wok, leaps into the air in fright, his head flame
      shooting up tall
    sfx: 爆油劈啪聲、阿炭尖叫
    caption: 九層塔下鍋的那一秒
    caption_en: The second the basil hit the oil

  - id: s02
    beat: setup
    duration: 5
    action: （十秒前）阿炭很專業地把裹粉雞塊放進油鍋，炸得金黃，他得意地點頭。
    camera: medium shot of the night-market stall counter
    prompt: >-
      Ten seconds earlier, calm: A-Tan stands on the counter of his night-market stall next to a
      wok of hot oil, carefully lowering floured chicken pieces in with a long slotted ladle. The
      chicken bubbles and turns golden-brown. He nods proudly to himself
    sfx: 穩定的油炸聲、哼歌
    caption: （十秒前）一切都很完美
    caption_en: (10 seconds earlier) Everything was perfect

  - id: s03
    beat: trouble
    duration: 5
    action: 他丟九層塔，爆油嚇到他，火焰往旁邊一噴，整個油鍋竄起大火，他抱頭。
    camera: medium-wide shot to fit the fire column
    prompt: >-
      A-Tan tosses basil into the wok, the oil pops loudly, he flinches, and his head flame bursts
      sideways and ignites the wok. A tall column of fire whooshes up from the wok. A-Tan covers
      his head with both arms
    sfx: 「轟」的一聲、火焰呼嘯
    caption: 完了完了完了
    caption_en: Oh no oh no oh no

  - id: s04
    beat: twist
    duration: 5
    action: 火一下就消失，他從手臂縫偷看：鍋裡的雞塊和九層塔炸得金黃酥脆、冒著香氣。
    camera: close-up on the wok, A-Tan peeking in the foreground
    prompt: >-
      The flames vanish as quickly as they came. A-Tan slowly peeks out between his arms. In the
      wok, the chicken pieces and basil leaves are perfectly crispy and golden, glistening, with
      fragrant steam curling up
    sfx: 火焰收掉的「咻」、安靜的油炸聲
    caption: 欸…好像更香了？
    caption_en: Wait... it smells even better?

  - id: s05
    beat: ending
    duration: 5
    action: 他把雞塊倒進紙袋撒胡椒鹽、甩一甩，插竹籤咬一口，喀滋，開心轉圈。
    camera: medium close-up, slightly high angle
    prompt: >-
      A-Tan pours the crispy chicken and basil into a paper bag, sprinkles pepper salt, and shakes
      the bag vigorously. He stabs a piece with a bamboo skewer, bites it with a loud crunch, and
      spins around happily
    sfx: 紙袋沙沙、喀滋、開心的叫聲
    caption: 新菜單：火焰鹽酥雞
    caption_en: "New menu item: flaming popcorn chicken"

