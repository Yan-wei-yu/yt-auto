  title: 那斯達克一週 -4.5%：通膨太熱、AI 欠債被檢查、台積電財報好也沒用｜韭菜週報 10/12–10/16
  description: |
    這週美股（10/12–10/16）：九月 CPI 年增 3.7%、CoreWeave 一週跌 25%、台積電財報打敗預期股價卻跌、Fed 主席華許一句「我不預判會議」……
    用卡通帶你看完這一週。

    資料來源：指數收盤與週漲跌取自新聞報導；個股週漲跌以 10/9 與 10/16 收盤價計算。
    旁白為 AI 語音合成。
  tags: [美股, 美股週報, 那斯達克, 輝達, 台積電, CoreWeave, 美光, CPI, 通膨, Fed, 升息, 華許, 普發現金, 韭菜, 散戶, 投資理財]
