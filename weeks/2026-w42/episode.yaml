# cast：誰上台（channel/cast.yaml）
#   mood：neutral / happy / laugh / shocked / nervous / cry / smug / angry / zipped
#   arms：down / up / hold / shrug / facepalm / point（物件預設不畫手）
#   holding：{type: card | sign | cash, text: ...}
#   say：對話框；真實人物只能放真的說過的話，並加 quote: true
# arrow：up / down，舞台背景畫一條大趨勢線
segments:
  - id: s01
    type: title
    chapter: 開場：本週又被割了
    headline: 那斯達克一週跌了這麼多
    stat: {label: 那斯達克 本週, value: -4.48}
    subhead: 六月以來最慘的一週
    arrow: down
    cast:
      - {who: cpi, mood: angry, arms: up}
      - {who: coreweave, mood: cry}
      - {who: warsh, mood: zipped}
    narration: >-
      大家好，歡迎收看韭菜週報，我們是一群每週都被割、每週都長回來的韭菜。
      這週美股，那斯達克一週跌了四點四八趴，是六月以來最慘的一週。
      通膨太熱、晶片股連跌、AI 公司欠的債也被翻出來檢查。
      這集帶你看完這週到底發生什麼事。

  - id: s02
    type: indices
    chapter: 本週大盤
    heading: 本週四大指數
    cast:
      - {who: nasdaq, mood: cry}
      - {who: dow, mood: smug}
    narration: >-
      先看大盤。S&P 500 一週跌一點九五趴，收在七千六百五十九點；那斯達克跌四點四八趴；
      小型股的羅素兩千跌三趴。唯一守住的是道瓊，還小漲零點六七趴。
      不過也別太悲觀，四大指數今年以來都還是上漲的，S&P 500 今年還漲了將近一成二。

  - id: s03
    type: topic
    chapter: 大事一：通膨太熱
    tag: 大事 1
    heading: 九月 CPI 年增 3.7%，比預期熱
    bullets:
      - 九月 CPI 月增 0.6%、年增 3.7%，主要是油價推升
      - 扣掉食物和能源的核心通膨，也高於預期
      - Fed 九月才升息一碼，利率來到 3.75%–4.00%
    arrow: up
    cast:
      - {who: cpi, mood: angry, arms: up}
    narration: >-
      第一件大事，通膨。週三公布的九月消費者物價指數，月增零點六趴、年增三點七趴，主要是汽油變貴；
      扣掉食物和能源的核心通膨，也比預期高。Fed 九月才剛升息一碼，利率區間來到三點七五到四趴。
      通膨一熱，市場馬上開始押十月還要再升。利率越高，借錢蓋 AI 資料中心就越貴，科技股當天就被賣。

  - id: s04
    type: topic
    chapter: 大事二：AI 的債被檢查
    tag: 大事 2
    heading: AI 公司欠的債，被市場翻出來檢查
    chart: CRWV
    bullets:
      - CoreWeave 靠大量借錢蓋資料中心，違約保險價格幾週內大幅飆升
      - 中國記憶體廠長鑫宣布技術進展，美光一週 -14.6%
    arrow: down
    cast:
      - {who: coreweave, mood: cry}
    narration: >-
      第二件大事：AI 的債。雲端算力公司 CoreWeave 這週跌了兩成五，光週五就跌了將近一成二。
      它靠大量借錢蓋資料中心，市場用來保它債務違約的保險，價格幾週內大幅飆升，
      有分析師直接說，這種新興雲端公司是「AI 交易裡的次級房貸」。
      同一週，中國記憶體廠長鑫宣布先進記憶體有進展，美光一週跌了十四點六趴。
      費城半導體指數到週四，已經連跌七天。

  - id: s05
    type: topic
    chapter: 大事三：台積電財報
    tag: 大事 3
    heading: 台積電財報打敗預期，股價卻一週 -9%
    chart: TSM
    bullets:
      - 每股盈餘 4.60 美元（預期 4.45），營收 467.2 億美元，獲利再創新高
      - 但對 2027 年的展望偏保守
    arrow: down
    cast:
      - {who: wei, mood: nervous, arms: hold, holding: {type: card, text: "EPS 4.60\n優於預期"}}
    narration: >-
      第三件，台積電。週四公布第三季財報，每股盈餘四點六美元，比預期的四點四五好，
      營收四百六十七億美元，獲利再創新高。照理說要漲吧？
      結果它對二零二七年的說法比較保守，加上整個晶片族群都在被賣，美國掛牌的台積電 ADR 一週跌了將近九趴。
      這就是韭菜最常遇到的：財報很好，股價很痛。

  - id: s06
    type: topic
    chapter: 大事四：Fed 主席一句話
    tag: 大事 4
    heading: 華許：「我不預判會議」
    bullets:
      - 週五 Fed 主席華許在國際貨幣基金的活動上，不給任何暗示
      - 市場押十月升息的機率，從週中高點掉回約 15%
      - 下一次利率決策：10/27–28
    cast:
      - {who: warsh, mood: zipped, say: 我不預判會議, quote: true}
    narration: >-
      第四件，Fed 主席華許。週五他在國際貨幣基金的活動上被問到利率，只說了一句：我不預判會議。
      就這樣一句話，市場押十月升息的機率，從週中的高點掉回大約一成五。
      高盛認為 Fed 十月會先暫停、十二月再升最後一次。
      下一次利率決策在十月二十七、二十八號，我已經先把鬧鐘調好了。

  - id: s07
    type: movers
    chapter: 本週漲跌排行
    heading: 本週觀察名單
    top: 8
    cast:
      - {who: oil, mood: laugh, arms: up}
      - {who: bofa, mood: nervous}
      - {who: coreweave, mood: cry}
    narration: >-
      整理一下這週的觀察名單。跌最兇的是 CoreWeave 負二十五趴，美光負十四點六，台積電 ADR 負九，
      特斯拉負七點三，輝達負六點六。美國銀行也跌了五點七趴，財報因為提列十二億美元的監管罰款，獲利衰退，
      週三盤中一度跌超過八趴。漲的呢？埃克森美孚漲將近六趴，蘋果也逆勢漲兩趴。
      晶片股被賣，資金跑去能源股和債券避險。

  - id: s08
    type: concept
    chapter: 本週時事概念股
    name: 普發現金概念股
    change: 1 萬 → 2 萬
    series: [0, 10000, 20000, 20000, 20000]
    labels: [8 月宣布, 9 月喊價, 10 月攻防, 到帳日？]
    bullets:
      - 政府版：明年每人 1 萬｜國民黨提議：今年再發 1 萬，合計 2 萬
      - 成交量：0（到現在還沒有人真的拿到錢）
    cast:
      - {who: gov, mood: happy, arms: up, holding: {type: sign, text: 1 萬}}
      - {who: kmt_caucus, mood: laugh, arms: up, holding: {type: sign, text: 2 萬}}
    narration: >-
      好，進入本週時事概念股，以下純屬虛構，不是真的股票。
      第一檔：普發現金概念股。八月政府宣布明年每人一萬，九月國民黨提議今年再發一萬、合計兩萬，
      一個多月漲了百分之百。十月朝野還在吵錢從哪裡來，股價高檔盤整。
      唯一的問題是成交量是零，因為到現在還沒有人真的拿到錢。我已經先把兩萬花完了。

  - id: s09
    type: concept
    name: 十月升息機率概念股
    change: 一週走完牛熊
    series: [20, 21, 54, 38, 15]
    labels: [週二, 週三 CPI, 週四, 週五 華許]
    bullets:
      - 週三 CPI 一出，十月升息機率暴衝
      - 週五華許一句「我不預判」，跌回約 15%
    cast:
      - {who: cpi, mood: laugh, arms: up}
      - {who: warsh, mood: zipped}
    narration: >-
      第二檔：十月升息機率概念股，一樣是虛構的。週三通膨數據一出，這檔直接暴衝，
      有報導指出，CME 的十月升息機率一度從兩成多跳到五成以上；
      週五華許說了一句我不預判會議，當場跌回一成五左右。
      一週之內走完一整個牛熊循環，比韭菜的心情還不穩定。

  - id: s10
    type: calendar
    chapter: 下週行事曆
    heading: 下週要看什麼（美東時間）
    events:
      - {date: 10/20 週二, item: 網飛 Netflix 財報（盤後，預計）}
      - {date: 10/20 週二, item: 特斯拉財報（盤後，預計）}
      - {date: 10/21 週三, item: IBM、德州儀器財報（盤後，預計）}
      - {date: 10/27–28, item: Fed 利率決策（下下週）}
    cast:
      - {who: musk, mood: smug, arms: shrug}
    narration: >-
      下週看什麼？財報季進入重頭戲。預計週二盤後有網飛和特斯拉，週三盤後有 IBM 和德州儀器，
      實際日期以公司公告為準。再下一週，十月二十七、二十八號就是 Fed 利率決策。
      我只提醒一件事：不是要你買什麼，是記得睡覺。

  - id: s11
    type: outro
    chapter: 結尾
    headline: 下週再一起被割
    bullets:
      - 訂閱：每週日 20:00，一起看完一週美股
      - 留言告訴我：你這週被割了幾趴？
    cast:
      - {who: nasdaq, mood: nervous}
      - {who: cpi, mood: laugh, arms: up}
      - {who: coreweave, mood: cry}
    narration: >-
      以上就是這週的韭菜週報。我們是散戶，不是老師，不報明牌，只陪你看懂新聞。
      覺得有幫助就訂閱，每週日晚上八點見。留言告訴我，你這週被割了幾趴？
      我們下週再一起被割，然後一起長回來。

