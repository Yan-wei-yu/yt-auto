youtube:
  title: 選後 AI 股大崩：那斯達克一天 -5.5%、台股一週 -12%｜韭菜週報 11/2–11/6
  description: |
    這週美股（11/2–11/6）：期中選舉民主黨拿下參眾兩院、週四晶片股大崩盤（費半一天 -12.25%）、台股一週跌 12%、國安基金第 10 度護盤、十月就業報告大超預期……
    用卡通帶你看完這一週。

    資料來源：指數收盤與週漲跌取自新聞報導；個股週漲跌以 10/30 與 11/6 收盤價計算。
    旁白為 AI 語音合成。
