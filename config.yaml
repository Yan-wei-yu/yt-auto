# 頻道與產線設定。改這裡就好，程式不用動。

channel:
  name: 韭菜週報
  name_en: Leek Weekly
  channel_id: UCZ_STmoY44fdZi7gr1B87Mw
  timezone: Asia/Taipei
  default_language: zh-TW

market:
  # 台灣習慣：紅漲綠跌（要改成美國習慣就把兩個顏色對調）
  up_color: "#FF4D4F"
  down_color: "#22C55E"
  # `python -m yt_auto fetch` 會抓這些（Yahoo Finance 代號）
  indices:
    - {symbol: "^GSPC", name: S&P 500}
    - {symbol: "^IXIC", name: 那斯達克}
    - {symbol: "^DJI", name: 道瓊}
    - {symbol: "^SOX", name: 費城半導體}
    - {symbol: "^RUT", name: 羅素 2000}
  watchlist:
    - {symbol: NVDA, name: 輝達}
    - {symbol: TSM, name: 台積電 ADR}
    - {symbol: AAPL, name: 蘋果}
    - {symbol: MSFT, name: 微軟}
    - {symbol: GOOGL, name: Google}
    - {symbol: AMZN, name: 亞馬遜}
    - {symbol: META, name: Meta}
    - {symbol: TSLA, name: 特斯拉}
    - {symbol: AVGO, name: 博通}
    - {symbol: AMD, name: AMD}
    - {symbol: MU, name: 美光}
    - {symbol: PLTR, name: Palantir}

youtube:
  # 27 = 教育
  category_id: "27"
  # 「為兒童打造」是你對 YouTube 的法律聲明：財經內容不是給兒童的，維持 false
  made_for_kids: false
  # 「經過修改或合成的內容」只針對「看起來像真的」的畫面或冒充真人的聲音。
  # 卡通角色＋圖表不需要；如果用 AI 模仿真人的臉或聲音，就要改成 true
  contains_synthetic_media: false
  license: youtube
  description_footer: |
    🥬 韭菜週報｜每週日 20:00，用一根韭菜的角度看完一週美股
    我們是散戶，不是老師：不報明牌、不喊進出場。

    ⚠️ 本頻道內容僅為新聞整理與娛樂，不構成任何投資建議。投資有風險，請自行判斷。
    「本週時事概念股」為虛構的諷刺單元，並非真實股票。

video:
  width: 1920
  height: 1080
  short_width: 1080
  short_height: 1920
  fps: 30
  # 每段旁白結束後多停幾秒，讓觀眾消化
  segment_pad: 0.4
  # 畫面緩慢推近，避免整段都是靜止圖
  ken_burns: true
  music_volume: 0.08
  # 頻道字型：jf open 粉圓（SIL OFL 1.1，已放在 channel/fonts/，任何電腦都一樣）
  # 後面幾個是備用：萬一字型檔不見了，依序找系統裡的中文字型
  fonts: [jf-openhuninn-2.1, Noto Sans TC, PingFang TC, Heiti TC, Microsoft JhengHei, WenQuanYi Zen Hei]
  subtitle_font: jf-openhuninn-2.1
  subtitle_size: 54
  short_subtitle_size: 64

voice:
  # 優先順序：你自己的錄音 weeks/<週>/voice/<段落id>.wav|mp3|m4a → AI 配音 → 靜音（只估長度）
  # engine：
  #   kokoro：離線 AI 配音，模型 Apache 2.0 可商用。第一次用先跑 python -m yt_auto tts-setup 下載模型
  #   edge：微軟 Edge 線上朗讀（台灣腔），但商用條款不明確，只建議拿來預覽
  engine: kokoro
  kokoro:
    model_dir: ~/.cache/yt-auto/kokoro-multi-lang-v1_1
    # 0–102 號聲音；試過最清楚的是 58（男）和 50（女）
    speaker: 58
    speed: 1.05
  tts_voice: zh-TW-YunJheNeural
  tts_rate: "+8%"
  # 沒有配音時估算長度用（中文旁白每秒約 4.5 字）
  chars_per_second: 4.5
  # 只影響配音、不影響字幕：讓 AI 唸對英文縮寫和專有名詞
  pronounce:
    "S&P 500": 標普五百
    Fed: 聯準會
    CPI: C P I
    ADR: A D R
    CME: C M E
    IBM: I B M
    EPS: E P S
    CoreWeave: Core Weave

paths:
  weeks: weeks
  build: build
  reports: reports
  state: state
  secrets: .secrets
  cast: channel/cast.yaml
  fonts: channel/fonts
  branding: channel
